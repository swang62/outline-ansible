---
- name: Wake Outline server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    local_outline_dir: "{{ playbook_dir }}/../files/outline"
    terraform_vars:
      - aws_region
      - instance_name
      - instance_type
      - ssh_public_key_path
      - cloudflare_zone
      - cloudflare_dns_name
  tasks:
    - name: Load shared variables
      ansible.builtin.include_vars:
        file: "{{ terraform_dir }}/global.auto.tfvars.json"
        name: global_vars

    - name: Provision the ready server
      ansible.builtin.import_tasks: tasks/provision_ready_server.yml

    - name: Reconcile Cloudflare DNS records
      ansible.builtin.import_tasks: tasks/cloudflare_dns.yml

    - name: Server addresses
      ansible.builtin.debug:
        msg: >-
          IPv4 {{ server_info.instances[0].public_ip_address }} |
          IPv6 {{ server_info.instances[0].ipv6_address }} |
          SSH {{ server_info.instances[0].public_ip_address if ssh_ipv4.state | default('') == 'started' else server_info.instances[0].ipv6_address }}

    - name: Save current server addresses
      ansible.builtin.copy:
        dest: "{{ local_outline_dir }}/addresses.txt"
        mode: "0644"
        content: "IPV4: {{ server_info.instances[0].public_ip_address }}\nIPV6: {{ server_info.instances[0].ipv6_address }}\n"

- name: Verify server is online
  hosts: ready_server
  become: true
  gather_facts: false
  vars:
    outline_hostname: "{{ global_vars.cloudflare_dns_name }}.{{ global_vars.cloudflare_zone }}"
    local_outline_dir: "{{ playbook_dir }}/../files/outline"
    outline_api_prefix: "{{ lookup('ansible.builtin.file', local_outline_dir + '/api-prefix') | trim }}"
  tasks:
    - name: Run shared server health checks
      ansible.builtin.import_tasks: tasks/server_health.yml
