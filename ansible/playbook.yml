---
- name: Provision EC2, Cloudwatch, and Cloudflare DNS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
  tasks:
    - name: Load shared variables
      ansible.builtin.include_vars:
        file: "{{ terraform_dir }}/global.auto.tfvars.json"
        name: global_vars

    - name: Apply terraform configuration
      cloud.terraform.terraform:
        project_path: "{{ terraform_dir }}"
        state: present
        force_init: true
        complex_vars: true
        variables: "{{ global_vars | combine(terraform_variables | default({}), recursive=true) }}"

    - name: Refresh inventory
      ansible.builtin.meta: refresh_inventory

    - name: Update cloudflare DNS
      community.general.cloudflare_dns:
        api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        zone: "{{ global_vars.cloudflare_zone }}"
        record: "{{ global_vars.cloudflare_dns_name }}"
        type: A
        value: "{{ hostvars[groups['aws_ec2'][0]].aws_public_ip_address }}"
        ttl: 60
        proxied: false
        solo: true
        state: present
      no_log: true
      when: lookup('env', 'CLOUDFLARE_API_TOKEN') | length > 0

- name: Configure server
  hosts: aws_ec2
  vars:
    ansible_user: ec2-user
    ansible_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/outline-ec2"
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10

    - name: Install the public key for root
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/outline-ec2.pub') }}"

    - name: Configure key-only SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-key-only.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          AllowAgentForwarding no
          AllowTcpForwarding yes
          AllowUsers root ec2-user
          ChallengeResponseAuthentication no
          ClientAliveCountMax 600
          ClientAliveInterval 30
          KbdInteractiveAuthentication no
          MaxAuthTries 3
          PasswordAuthentication no
          PermitEmptyPasswords no
          PermitRootLogin prohibit-password
          PermitUserEnvironment no
          PubkeyAuthentication yes
          X11Forwarding no
      notify: Restart sshd

    - name: Add shell aliases
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        marker: "# {mark} Ansible managed shell aliases"
        block: |
          alias ll='ls -alHF'
          alias ls='command ls -aHF'
        state: present
        create: true

    - name: Install dnf-automatic
      ansible.builtin.package:
        name: dnf-automatic
        state: present

    - name: Apply only security updates automatically
      community.general.ini_file:
        path: /etc/dnf/automatic.conf
        section: commands
        option: upgrade_type
        value: default

    - name: Install updates automatically, not just download
      community.general.ini_file:
        path: /etc/dnf/automatic.conf
        section: commands
        option: apply_updates
        value: "yes"

    - name: Enable dnf-automatic timer
      ansible.builtin.systemd:
        name: dnf-automatic.timer
        state: started
        enabled: true

    - name: Install boot-time update service
      ansible.builtin.copy:
        dest: /etc/systemd/system/dnf-update-boot.service
        content: |
          [Unit]
          Description=Full dnf update at boot
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/dnf -y update

          [Install]
          WantedBy=multi-user.target

    - name: Enable boot-time update service
      ansible.builtin.systemd:
        name: dnf-update-boot.service
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

- name: Verify server health
  hosts: aws_ec2
  gather_facts: false
  tasks:
    - name: Ping server over ICMP
      ansible.builtin.command:
        argv:
          - ping
          - -c
          - "4"
          - "{{ aws_public_ip_address }}"
      delegate_to: localhost
      changed_when: false
      register: health_icmp

    - name: Ping server over SSH
      ansible.builtin.ping:
      register: health_ping

    - name: Confirm both health checks passed
      ansible.builtin.assert:
        that:
          - health_icmp.rc == 0
          - health_ping.ping == "pong"
