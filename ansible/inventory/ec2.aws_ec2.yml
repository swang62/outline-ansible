---
plugin: amazon.aws.aws_ec2
regions:
  - "{{ (lookup('ansible.builtin.file', lookup('ansible.builtin.pipe', 'git rev-parse --show-toplevel') + '/terraform/global.auto.tfvars.json') | from_json).aws_region }}"
filters:
  tag:Name: outline-ec2
hostnames:
  - ip-address
hostvars_prefix: aws_
compose:
  ec2_tags: aws_ec2_tags
  ansible_user: "'ec2-user'"
  ansible_private_key_file: "'~/.ssh/outline-ec2'"
