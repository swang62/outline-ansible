---
- name: Stop Outline server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
  tasks:
    - name: Load shared variables
      ansible.builtin.include_vars:
        file: "{{ terraform_dir }}/global.auto.tfvars.json"
        name: global_vars

    - name: Resolve instance id from terraform
      ansible.builtin.shell:
        cmd: |
          id="$(terraform -chdir={{ terraform_dir }} output -raw instance_id 2>/dev/null)" || exit 0
          echo "$id"
      register: tf_instance_id
      changed_when: false
      failed_when: false

    - name: Query instance state
      ansible.builtin.shell:
        cmd: |
          id="{{ tf_instance_id.stdout | trim }}"
          if [ -z "$id" ]; then
            exit 0
          fi
          aws ec2 describe-instances \
            --instance-ids "$id" \
            --region "{{ global_vars.aws_region }}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo unknown
      register: instance_state
      changed_when: false
      failed_when: false

    - name: Stop instance
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - stop-instances
          - --instance-ids
          - "{{ tf_instance_id.stdout | trim }}"
          - --region
          - "{{ global_vars.aws_region }}"
      when:
        - tf_instance_id.stdout | trim | length > 0
        - instance_state.stdout | trim == 'running'
      changed_when: true

    - name: Report result
      ansible.builtin.debug:
        msg: >-
          {% if tf_instance_id.stdout | trim | length > 0 and instance_state.stdout | trim == 'running' %}
          instance {{ tf_instance_id.stdout | trim }} stopped
          {% elif tf_instance_id.stdout | trim | length == 0 %}
          no instance found
          {% else %}
          instance {{ tf_instance_id.stdout | trim }} already {{ instance_state.stdout | trim }}, nothing to do
          {% endif %}
